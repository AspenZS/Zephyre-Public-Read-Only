name: Refresh public Zephyre data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-zephyre-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public read-only resources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 https://zephyresystems.com/llms.txt -o llms.txt.new
          curl --fail --silent --show-error --retry 3 https://zephyresystems.com/llms-full.txt -o llms-full.txt.new
          curl --fail --silent --show-error --retry 3 https://zephyresystems.com/status.md -o status.md.new
          curl --fail --silent --show-error --retry 3 https://zephyresystems.com/status.json -o status.json.new
          jq . status.json.new > status.json.formatted
          mv llms.txt.new llms.txt
          mv llms-full.txt.new llms-full.txt
          mv status.md.new status.md
          mv status.json.formatted status.json
      - name: Commit a changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Zephyre public-data updater'
          git config user.email 'actions@users.noreply.github.com'
          git add llms.txt llms-full.txt status.md status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh public Zephyre snapshot'
          git push
